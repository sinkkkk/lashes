# Netlify hosting (free plan, allowed for business use). Netlify detects Next.js and uses its
# Next.js runtime automatically. Settings like passwords and keys go in the Netlify dashboard
# (Project configuration → Environment variables), not here.
[build]
  command = "npm run build"
  publish = ".next"

[functions]
  # Fonts read at run time by the review image generator (src/app/api/admin/review-image)
  included_files = ["src/assets/fonts/**"]
